<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculators | DailyBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Google AdSense: after approval, uncomment and replace ca-pub-XXXXXXXXXXXXXXXX with your real Publisher ID -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7556060817055750" crossorigin="anonymous" </script>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<nav>
  <a href="index.html" class="brand">Daily<span>Board</span></a>
  <button class="navtoggle" id="navToggle" aria-label="Menu" aria-expanded="false">☰</button>
  <div class="navlinks" id="navLinks">
    <a href="index.html">Home</a>
    <a href="weather.html">Weather</a>
    <a href="rates.html">Rates</a>
    <a href="calculator.html" class="current">Calculators</a>
    <a href="about.html">About</a>
  </div>
</nav>

<main id="main">
  <section>
    <div class="section-head">
      <div class="eyebrow">Tools</div>
      <h2>Calculators</h2>
      <p>EMI, CGPA to percentage, age, and years of experience.</p>
    </div>

    <div class="calc-tabs" role="tablist">
      <button class="calc-tab" role="tab" aria-selected="true" data-target="emi">EMI</button>
      <button class="calc-tab" role="tab" aria-selected="false" data-target="cgpa">CGPA → %</button>
      <button class="calc-tab" role="tab" aria-selected="false" data-target="age">Age</button>
      <button class="calc-tab" role="tab" aria-selected="false" data-target="exp">Experience</button>
    </div>

    <div class="calc-panel active" id="panel-emi">
      <div class="calc-card">
        <div class="field-row">
          <div class="field"><label for="loanAmt">Loan Amount (₹)</label><input type="number" id="loanAmt" value="500000"></div>
          <div class="field"><label for="loanRate">Interest Rate (% p.a.)</label><input type="number" id="loanRate" value="9.5" step="0.1"></div>
          <div class="field"><label for="loanYears">Tenure (years)</label><input type="number" id="loanYears" value="5"></div>
        </div>
        <div class="calc-result">
          <div class="big" id="emiOut">₹ 0 / month</div>
          <div class="small" id="emiSub">Total payable: —</div>
        </div>
      </div>
    </div>

    <div class="calc-panel" id="panel-cgpa">
      <div class="calc-card">
        <div class="field-row">
          <div class="field"><label for="cgpaVal">Your CGPA (out of 10)</label><input type="number" id="cgpaVal" value="8.5" step="0.01" min="0" max="10"></div>
        </div>
        <div class="calc-result">
          <div class="big" id="cgpaOut">Percentage: 0%</div>
          <div class="small">Formula used: Percentage = CGPA × 9.5 (standard 10-point scale conversion)</div>
        </div>
      </div>
    </div>

    <div class="calc-panel" id="panel-age">
      <div class="calc-card">
        <div class="field-row">
          <div class="field">
            <label for="dob">Date of Birth (DD/MM/YYYY)</label>
            <input type="text" id="dob" placeholder="DD/MM/YYYY" maxlength="10" inputmode="numeric">
          </div>
        </div>
        <div class="calc-result">
          <div class="big" id="ageOut">Type a date, e.g. 15/08/1995</div>
          <div class="small" id="ageSub">&nbsp;</div>
        </div>
      </div>
    </div>

    <div class="calc-panel" id="panel-exp">
      <div class="calc-card">
        <div class="field-row">
          <div class="field">
            <label for="joinDate">Joining Date (DD/MM/YYYY)</label>
            <input type="text" id="joinDate" placeholder="DD/MM/YYYY" maxlength="10" inputmode="numeric">
          </div>
          <div class="field">
            <label for="endDate">As of Date (leave blank for today)</label>
            <input type="text" id="endDate" placeholder="DD/MM/YYYY" maxlength="10" inputmode="numeric">
          </div>
        </div>
        <div class="calc-result">
          <div class="big" id="expOut">Type your joining date, e.g. 01/06/2022</div>
          <div class="small" id="expSub">&nbsp;</div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>© <span id="year"></span> DailyBoard · <a href="privacy.html">Privacy Policy</a> · <a href="contact.html">Contact</a></footer>

<script>
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    const open = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open);
  });
  document.getElementById('year').textContent = new Date().getFullYear();

  const tabs = document.querySelectorAll('.calc-tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.setAttribute('aria-selected','false'));
      tab.setAttribute('aria-selected','true');
      document.querySelectorAll('.calc-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + tab.dataset.target).classList.add('active');
    });
  });

  // ---- EMI ----
  function calcEMI(){
    const P = parseFloat(document.getElementById('loanAmt').value) || 0;
    const annualRate = parseFloat(document.getElementById('loanRate').value) || 0;
    const years = parseFloat(document.getElementById('loanYears').value) || 0;
    const r = annualRate / 12 / 100;
    const n = years * 12;
    if (P <= 0 || r <= 0 || n <= 0) {
      document.getElementById('emiOut').textContent = '₹ 0 / month';
      document.getElementById('emiSub').textContent = 'Enter valid values';
      return;
    }
    const emi = P * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
    const total = emi * n;
    document.getElementById('emiOut').textContent = `₹ ${emi.toFixed(0)} / month`;
    document.getElementById('emiSub').textContent = `Total payable: ₹ ${total.toFixed(0)} (interest: ₹ ${(total-P).toFixed(0)})`;
  }
  ['loanAmt','loanRate','loanYears'].forEach(id => document.getElementById(id).addEventListener('input', calcEMI));
  calcEMI();

  // ---- CGPA to Percentage ----
  function calcCGPA(){
    const cgpa = parseFloat(document.getElementById('cgpaVal').value) || 0;
    const pct = Math.min(100, Math.max(0, cgpa * 9.5));
    document.getElementById('cgpaOut').textContent = `Percentage: ${pct.toFixed(2)}%`;
  }
  document.getElementById('cgpaVal').addEventListener('input', calcCGPA);
  calcCGPA();

  // ---- Age ----
  document.getElementById('dob').addEventListener('change', (e) => {
    const dob = new Date(e.target.value);
    if (isNaN(dob)) return;
    const today = new Date();
    let years = today.getFullYear() - dob.getFullYear();
    let months = today.getMonth() - dob.getMonth();
    let days = today.getDate() - dob.getDate();
    if (days < 0) { months -= 1; days += new Date(today.getFullYear(), today.getMonth(), 0).getDate(); }
    if (months < 0) { years -= 1; months += 12; }
    document.getElementById('ageOut').textContent = `${years} years, ${months} months, ${days} days`;
    document.getElementById('ageSub').textContent = `Total days lived: ${Math.floor((today - dob) / 86400000)}`;
  });

  // ---- Years of Experience ----
  function calcExperience(){
    const joinVal = document.getElementById('joinDate').value;
    if (!joinVal) return;
    const join = new Date(joinVal);
    const endVal = document.getElementById('endDate').value;
    const end = endVal ? new Date(endVal) : new Date();
    if (isNaN(join) || isNaN(end) || end < join) {
      document.getElementById('expOut').textContent = 'Check the dates entered';
      document.getElementById('expSub').textContent = '&nbsp;';
      return;
    }
    let years = end.getFullYear() - join.getFullYear();
    let months = end.getMonth() - join.getMonth();
    let days = end.getDate() - join.getDate();
    if (days < 0) { months -= 1; days += new Date(end.getFullYear(), end.getMonth(), 0).getDate(); }
    if (months < 0) { years -= 1; months += 12; }
    document.getElementById('expOut').textContent = `${years} years, ${months} months, ${days} days`;
    document.getElementById('expSub').textContent = `Total experience in months: ${(years*12+months)} · Total days: ${Math.floor((end - join) / 86400000)}`;
  }
  document.getElementById('joinDate').addEventListener('change', calcExperience);
  document.getElementById('endDate').addEventListener('change', calcExperience);
</script>
</body>
</html>
