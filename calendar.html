<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar | DailyBoard</title>
<meta name="description" content="Monthly calendar with holidays and festivals marked.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Kannada:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>(function(){try{if(localStorage.getItem("dailyboard_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7556060817055750" crossorigin="anonymous"></script>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<nav>
  <a href="/home" class="brand">Daily<span>Board</span></a>
  <button class="navtoggle" id="navToggle" aria-label="Menu" aria-expanded="false"><i data-lucide="menu"></i></button>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"><i data-lucide="moon"></i></button>
  <div class="navlinks" id="navLinks">
    <a href="/home">Home</a>
    <a href="/weather">Weather</a>
    <a href="/rates">Rates</a>
    <a href="/calculator">Calculators</a>
    <a href="/calendar" class="current">Calendar</a>
    <a href="/news">News</a>
    <a href="/fun">Fun</a>
    <a href="/todo">To-Do</a>
    <a href="/about">About</a>
  </div>
</nav>

<main id="main">
  <div class="board-wrap" style="padding-top:8px"></div>
  <section>
  <div class="section-head">
    <div class="eyebrow">Calendar</div>
    <h2>Monthly Calendar</h2>
    <p>Holidays and festivals are marked. Use the arrows to browse months.</p>
  </div>
  <div class="calc-card">
    <div class="cal-toolbar">
      <button class="calc-tab" id="calPrev" aria-label="Previous month">&larr;</button>
      <div class="cal-title" id="calTitle"></div>
      <button class="calc-tab" id="calNext" aria-label="Next month">&rarr;</button>
    </div>
    <div class="cal-today-row"><button class="calc-tab" id="calToday">Today</button></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend"><span class="cal-dot"></span> Holiday / festival &nbsp; <span class="cal-dot cal-dot-today"></span> Today</div>
  </div>
  <div class="section-head" style="margin-top:36px;">
    <div class="eyebrow">This month</div>
    <h2>Events</h2>
  </div>
  <div class="calc-card"><ul class="cal-list" id="calList"></ul></div>
</section>
</main>

<footer>&copy; <span id="year"></span> DailyBoard &middot; <a href="/privacy">Privacy Policy</a> &middot; <a href="/contact">Contact</a> &middot; <a href="/guides">Guides</a></footer>

<script>
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => { const open = navLinks.classList.toggle('open'); navToggle.setAttribute('aria-expanded', open); });
  const themeToggle = document.getElementById('themeToggle');
  function applyThemeIcon(){ themeToggle.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>'; if (window.lucide) lucide.createIcons(); }
  applyThemeIcon();
  themeToggle.addEventListener('click', () => { const isDark = document.documentElement.getAttribute('data-theme') === 'dark'; if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('dailyboard_theme','light'); } else { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('dailyboard_theme','dark'); } applyThemeIcon(); });
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
<script src="calendar.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>if(window.lucide){ lucide.createIcons(); }</script>
<script src="chatbot.js"></script>
<script src="scroll-theme.js"></script>
</body>
</html>
